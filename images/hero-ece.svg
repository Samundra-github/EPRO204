<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="24" fill="#F2ECE1"/>
  <circle cx="660" cy="110" r="140" fill="#E6DDD0" opacity="0.7"/>
  <circle cx="140" cy="390" r="160" fill="#D8E8DD" opacity="0.6"/>
  
  <!-- Warm architectural arch -->
  <path d="M120 440 V190 C120 115 240 115 240 190 V440 Z" fill="#FAF7F2" stroke="#7D9B84" stroke-width="2"/>
  <path d="M270 440 V160 C270 70 530 70 530 160 V440 Z" fill="#FAF7F2" stroke="#1E3F2D" stroke-width="2.5"/>
  <path d="M560 440 V200 C560 125 680 125 680 200 V440 Z" fill="#FAF7F2" stroke="#C86D51" stroke-width="2"/>

  <!-- Eucalyptus leaves motif -->
  <g stroke="#1E3F2D" stroke-width="2.5" stroke-linecap="round">
    <path d="M180 220 Q180 310 180 390"/>
    <ellipse cx="160" cy="250" rx="16" ry="26" transform="rotate(-25 160 250)" fill="#7D9B84"/>
    <ellipse cx="200" cy="275" rx="16" ry="26" transform="rotate(25 200 275)" fill="#1E3F2D"/>
    <ellipse cx="162" cy="315" rx="15" ry="24" transform="rotate(-20 162 315)" fill="#1E3F2D"/>
    <ellipse cx="198" cy="340" rx="15" ry="24" transform="rotate(20 198 340)" fill="#7D9B84"/>
  </g>

  <!-- Central circle: Educator & diverse young children reading together -->
  <circle cx="400" cy="260" r="95" fill="#EAF0EB" stroke="#7D9B84" stroke-width="2"/>
  <!-- Educator figure -->
  <circle cx="400" cy="215" r="24" fill="#C86D51"/>
  <path d="M350 310 C350 265 450 265 450 310 Z" fill="#1E3F2D"/>
  <!-- Child left -->
  <circle cx="348" cy="258" r="18" fill="#8F432C"/>
  <path d="M320 325 C320 292 376 292 376 325 Z" fill="#7D9B84"/>
  <!-- Child right -->
  <circle cx="452" cy="258" r="18" fill="#B0573C"/>
  <path d="M424 325 C424 292 480 292 480 325 Z" fill="#C86D51"/>
  <!-- Open storybook -->
  <path d="M355 295 L400 310 L445 295 L445 335 L400 350 L355 335 Z" fill="#FAF7F2" stroke="#1E3F2D" stroke-width="3"/>
  <line x1="400" y1="310" x2="400" y2="350" stroke="#1E3F2D" stroke-width="2.5"/>

  <!-- Right arch: Community resilience & protective hands/sun -->
  <circle cx="620" cy="225" r="28" fill="#C86D51" opacity="0.85"/>
  <path d="M585 330 Q620 275 655 330" stroke="#1E3F2D" stroke-width="4" fill="#D8E8DD"/>
  <path d="M595 365 Q620 340 645 365" stroke="#7D9B84" stroke-width="3" fill="none"/>

  <!-- Bottom Editorial Banner -->
  <rect x="90" y="425" width="620" height="45" rx="10" fill="#1E3F2D"/>
  <text x="400" y="453" text-anchor="middle" fill="#FAF7F2" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Australian Early Childhood Education • Belonging, Cultural Responsive Practice &amp; Resilience
  </text>
</svg>
