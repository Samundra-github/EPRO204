<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <rect width="800" height="460" rx="22" fill="#FAF7F2" stroke="#D8E8DD" stroke-width="4"/>
  <!-- Background woven tapestry pattern representing My Two Blankets -->
  <rect x="40" y="35" width="330" height="390" rx="18" fill="#F7E3DC" stroke="#C86D51" stroke-width="2"/>
  <rect x="430" y="35" width="330" height="390" rx="18" fill="#EAF0EB" stroke="#1E3F2D" stroke-width="2"/>
  <!-- Bridge connecting Both Blankets (Translanguaging & Cultural Capital) -->
  <rect x="295" y="155" width="210" height="150" rx="20" fill="#1E3F2D" stroke="#FAF7F2" stroke-width="4"/>
  
  <!-- Left Card: Home Heritage & First Language (L1) -->
  <circle cx="190" cy="120" r="42" fill="#C86D51" opacity="0.2"/>
  <text x="190" y="127" text-anchor="middle" fill="#8F432C" font-family="Georgia, serif" font-size="22" font-weight="bold">L1 • Home</text>
  <text x="190" y="185" text-anchor="middle" fill="#1F2421" font-family="Georgia, serif" font-size="18" font-weight="bold">Embodied Cultural Capital</text>
  <text x="190" y="218" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Family Lullabies &amp; Oral Stories</text>
  <text x="190" y="244" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Multilingual Funds of Knowledge</text>
  <text x="190" y="270" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Kinship &amp; Collectivist Care</text>
  <text x="190" y="296" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Pre-Migration Resilience</text>
  <rect x="85" y="340" width="210" height="44" rx="10" fill="#C86D51"/>
  <text x="190" y="367" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="13" font-weight="bold">22.2% Speak LOTE at Home (ABS)</text>

  <!-- Right Card: Australian ECEC Sanctuary (L2 & Belonging) -->
  <circle cx="610" cy="120" r="42" fill="#7D9B84" opacity="0.25"/>
  <text x="610" y="127" text-anchor="middle" fill="#1E3F2D" font-family="Georgia, serif" font-size="20" font-weight="bold">ECEC Sanctuary</text>
  <text x="610" y="185" text-anchor="middle" fill="#1F2421" font-family="Georgia, serif" font-size="18" font-weight="bold">Culturally Responsive Pedagogy</text>
  <text x="610" y="218" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• SA Bilingual Support Program</text>
  <text x="610" y="244" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Trauma-Informed Co-Regulation</text>
  <text x="610" y="270" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• Primary Caregiver Attachment</text>
  <text x="610" y="296" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="13">• AMRC &amp; STTARS Partnerships</text>
  <rect x="505" y="340" width="210" height="44" rx="10" fill="#7D9B84"/>
  <text x="610" y="367" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="13" font-weight="bold">26.8% LBOTE Children (AEDC)</text>

  <!-- Center Bridge Text -->
  <text x="400" y="205" text-anchor="middle" fill="#FAF7F2" font-family="Georgia, serif" font-size="17" font-weight="bold">Reciprocal Mesosystem</text>
  <text x="400" y="232" text-anchor="middle" fill="#D8E8DD" font-family="sans-serif" font-size="12">Translanguaging Story Baskets</text>
  <text x="400" y="254" text-anchor="middle" fill="#D8E8DD" font-family="sans-serif" font-size="12">Sensory Retreat &amp; Visual Cues</text>
  <text x="400" y="276" text-anchor="middle" fill="#F7E3DC" font-family="sans-serif" font-size="12" font-weight="bold">EYLF V2.0 Outcomes 1, 3 &amp; 5</text>
</svg>
