<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <rect width="800" height="460" rx="22" fill="#FAF7F2" stroke="#E6DDD0" stroke-width="3"/>
  
  <!-- Three Phases Banner: Preparedness, Trauma-Informed Response, Ecological Recovery -->
  <rect x="40" y="40" width="225" height="380" rx="18" fill="#F2ECE1" stroke="#7D9B84" stroke-width="2"/>
  <rect x="287" y="40" width="225" height="380" rx="18" fill="#FCF4F1" stroke="#C86D51" stroke-width="2.5"/>
  <rect x="535" y="40" width="225" height="380" rx="18" fill="#EAF0EB" stroke="#1E3F2D" stroke-width="2.5"/>

  <!-- Column 1: Preparedness -->
  <circle cx="152" cy="105" r="36" fill="#7D9B84" opacity="0.25"/>
  <text x="152" y="112" text-anchor="middle" fill="#1E3F2D" font-family="Georgia, serif" font-size="16" font-weight="bold">1. Preparedness</text>
  <text x="152" y="165" text-anchor="middle" fill="#1F2421" font-family="Georgia, serif" font-size="16" font-weight="bold">Reg 97 &amp; SA Risk Register</text>
  <text x="152" y="200" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Quarterly Playful Drills</text>
  <text x="152" y="226" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Social Stories for Under-5s</text>
  <text x="152" y="252" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Infant Comfort Grab-Bags</text>
  <text x="152" y="278" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• SA High Bushfire Audits</text>
  <rect x="65" y="345" width="175" height="42" rx="10" fill="#7D9B84"/>
  <text x="152" y="371" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="12" font-weight="bold">NQS QA2 Health &amp; Safety</text>

  <!-- Column 2: Somatic Co-Regulation -->
  <circle cx="400" cy="105" r="36" fill="#C86D51" opacity="0.25"/>
  <text x="400" y="112" text-anchor="middle" fill="#8F432C" font-family="Georgia, serif" font-size="16" font-weight="bold">2. Safe Base</text>
  <text x="400" y="165" text-anchor="middle" fill="#1F2421" font-family="Georgia, serif" font-size="16" font-weight="bold">Somatic Co-Regulation</text>
  <text x="400" y="200" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Predictable Daily Rhythms</text>
  <text x="400" y="226" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• "Turtle Breath" &amp; Heavy Work</text>
  <text x="400" y="252" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Weather &amp; Feelings Check-In</text>
  <text x="400" y="278" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Psychological First Aid</text>
  <rect x="312" y="345" width="175" height="42" rx="10" fill="#C86D51"/>
  <text x="400" y="371" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="12" font-weight="bold">1.4M Children/Yr Impacted</text>

  <!-- Column 3: Restorative Play & Social Capital -->
  <circle cx="647" cy="105" r="36" fill="#1E3F2D" opacity="0.18"/>
  <text x="647" y="112" text-anchor="middle" fill="#1E3F2D" font-family="Georgia, serif" font-size="16" font-weight="bold">3. Regeneration</text>
  <text x="647" y="165" text-anchor="middle" fill="#1F2421" font-family="Georgia, serif" font-size="16" font-weight="bold">Therapeutic Story &amp; Play</text>
  <text x="647" y="200" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Birdie’s Tree Puppet Play</text>
  <text x="647" y="226" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Helper &amp; Regrowth Small-Worlds</text>
  <text x="647" y="252" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Emerging Minds Toolkit</text>
  <text x="647" y="278" text-anchor="middle" fill="#353C37" font-family="sans-serif" font-size="12.5">• Red Cross &amp; Recovery SA</text>
  <rect x="560" y="345" width="175" height="42" rx="10" fill="#1E3F2D"/>
  <text x="647" y="371" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="12" font-weight="bold">Ordinary Magic Resilience</text>
</svg>
